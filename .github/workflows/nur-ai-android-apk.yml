name: Build Nūr AI APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nur-ai-android-apk.yml'
      - 'android-ai/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Nūr AI debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Nūr AI APK
        working-directory: android-ai
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists and is non-empty
        run: test -s android-ai/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nur-AI-debug-apk
          path: android-ai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
