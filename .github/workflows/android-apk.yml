name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Compile Tailwind CSS into local Android asset
        run: npx --yes tailwindcss@3.4.17 --config android/tailwind.config.cjs --input android/tailwind.input.css --output android/app/src/main/assets/tailwind.min.css --minify

      - name: Bundle Font Awesome for offline icons
        run: |
          mkdir -p android/app/src/main/assets/webfonts
          curl --fail --location --silent --show-error https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css -o android/app/src/main/assets/fontawesome.min.css
          sed -i 's#../webfonts/#webfonts/#g' android/app/src/main/assets/fontawesome.min.css
          for font in fa-solid-900.woff2 fa-regular-400.woff2 fa-brands-400.woff2; do
            curl --fail --location --silent --show-error "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/webfonts/$font" -o "android/app/src/main/assets/webfonts/$font"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists and is non-empty
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsmaulHusna-Nur-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
